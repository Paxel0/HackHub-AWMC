name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Build & Test Backend (Java + Maven)
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    # Container di servizio per i test automatici con Postgres (DB)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hackhub_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Health check per aspettare che il DB sia pronto
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./HackhubBack

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Permessi di esecuzione per mvnw
      run: chmod +x mvnw

    - name: Build e Test con Maven
      # Passiamo le variabili d'ambiente per collegarsi a Postgres
      env:
        DB_URL: jdbc:postgresql://localhost:5432/hackhub_test_db
        DB_USERNAME: test_user
        DB_PASSWORD: test_password
        HACKHUB_APP_JWTSECRETBASE64: "dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcw=="
      run: ./mvnw -B verify

  # Container di servizio per i test automatici del frontend (Angular)
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./HackhubFront

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: HackhubFront/package-lock.json

    - name: Installazione dipendenze
      run: npm ci

    - name: Linting
      # Controlla la qualità del codice (può essere disabilitato se rallenta troppo la pipeline)
      run: npm run lint
      # run: echo "Linting skipped"

    - name: Esecuzione Test Unitari
      # Usa browser "ChromeHeadless" (per l'esecuzione automatica in ambiente CI senza interfaccia grafica)
      run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

    - name: Build di produzione
      run: npm run build -- --configuration production

  # Container di servizio per i test automatici per Docker (verifica che le immagini si costruiscano correttamente)
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Repository Owner
      id: owner
      run: echo "lc=${OWNER,,}" >>$GITHUB_OUTPUT
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build & Push Backend
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./HackhubBack
        file: ./HackhubBack/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:latest
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:${{ github.sha }}

    # Build & Push Frontend
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./HackhubFront
        file: ./HackhubFront/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:latest
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:${{ github.sha }}

    # Container di servizio per i test automatici di Deploy su EC2 con K3s (versione Kubernetes più leggera)
  deploy:
    name: Deploy to AWS EC2 (k3s)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Lowercase Repository Owner
      id: owner
      run: echo "lc=${OWNER,,}" >>$GITHUB_OUTPUT
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        set -eux

        # Setup SSH Key
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        set +e
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>&1
        set -e

        # Connessione SSH per liberare memoria sulla macchina EC2 (a volte K3s o Docker rimangono appesi e consumano RAM, causando problemi di deploy)
        echo "EMERGENCY CLEANUP: Stopping Docker to free RAM..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST << EOF
           # Spegne tutto quello che trova di Docker
           docker kill \$(docker ps -q) || true
           docker system prune -af || true
           # Ferma anche K3s se era rimasto appeso
           sudo systemctl stop k3s || true
        EOF
        
        # Ora che la RAM è libera, copiamo i file
        echo "Copying k8s manifests..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST "mkdir -p /home/$USER/hackhub/k8s"
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r k8s/* $USER@$HOST:/home/$USER/hackhub/k8s/

        # Installazione e Deploy
        echo "Installing K3s & Deploying..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST << EOF
          set -e
          
          # Install K3s (se manca)
          if ! command -v k3s &> /dev/null; then
             curl -sfL https://get.k3s.io | sh -
             sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          else
             sudo systemctl start k3s # Riaccendiamolo se l'abbiamo spento sopra
          fi
          
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          
          # Secrets
          sudo k3s kubectl delete secret postgres-secret backend-secrets --ignore-not-found
          sudo k3s kubectl create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD_PROD }}'
          sudo k3s kubectl create secret generic backend-secrets --from-literal=HACKHUB_APP_JWTSECRETBASE64='${{ secrets.JWT_SECRET }}'

          # Aggioirna le immagini prendendi le ultime versioni da GitHub
          FULL_IMAGE_BACK="ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:latest"
          FULL_IMAGE_FRONT="ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:latest"
          sed -i "s|image: hackhub-backend:latest|image: \$FULL_IMAGE_BACK|g" /home/$USER/hackhub/k8s/backend/backend-deployment.yaml
          sed -i "s|image: hackhub-frontend:latest|image: \$FULL_IMAGE_FRONT|g" /home/$USER/hackhub/k8s/frontend/frontend-deployment.yaml

          # Crea o aggiorna le risorse Kubernetes (Deployment, Service, Ingress)
          sudo k3s kubectl apply -R -f /home/$USER/hackhub/k8s/
          
          # Riavvio forzato dei pod per prendere le nuove immagini
          sudo k3s kubectl rollout restart deployment hackhub-backend
          sudo k3s kubectl rollout restart deployment hackhub-frontend
        EOF