name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ======================================================
  # 1. Build & Test Backend (Java + Maven)
  # ======================================================
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    # Servizi container per il job (DB per i test)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hackhub_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Health check per aspettare che il DB sia pronto
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./HackhubBack

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Permessi di esecuzione per mvnw
      run: chmod +x mvnw

    - name: Build e Test con Maven
      # Passiamo le variabili d'ambiente per collegarsi al servizio Postgres
      env:
        DB_URL: jdbc:postgresql://localhost:5432/hackhub_test_db
        DB_USERNAME: test_user
        DB_PASSWORD: test_password
        HACKHUB_APP_JWTSECRETBASE64: "dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcw==" # A dummy base64 key
      run: ./mvnw -B verify

  # Job per il Frontend (Angular)
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./HackhubFront

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: HackhubFront/package-lock.json

    - name: Installazione dipendenze
      run: npm ci

    - name: Linting
      # Aggiungi se hai configurato linting, altrimenti commenta
      # run: npm run lint
      run: echo "Linting skipped"

    - name: Esecuzione Test Unitari
      # Usa browser "ChromeHeadless" standard per la CI (il nuovo Karma lo riconosce)
      run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

    - name: Build di produzione
      run: npm run build -- --configuration production

  # Job per Docker (Build & Push su GitHub Container Registry)
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Repository Owner
      id: owner
      run: echo "lc=${OWNER,,}" >>$GITHUB_OUTPUT
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build & Push Backend
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./HackhubBack
        file: ./HackhubBack/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:latest
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:${{ github.sha }}

    # Build & Push Frontend
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./HackhubFront
        file: ./HackhubFront/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:latest
          ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:${{ github.sha }}

    # Job di Deploy su EC2 con K3s (Kubernetes)
  deploy:
    name: Deploy to AWS EC2 (k3s)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Lowercase Repository Owner
      id: owner
      run: echo "lc=${OWNER,,}" >>$GITHUB_OUTPUT
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        set -eux

        echo "Configuring SSH key..."
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Scansione chiavi host (con gestione errori)
        set +e
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>&1
        set -e

        echo "Preparation: Creating directories..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST "mkdir -p /home/$USER/hackhub/k8s"

        echo "Copying k8s manifests..."
        # Copia ricorsiva della cartella k8s sulla EC2
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r k8s/* $USER@$HOST:/home/$USER/hackhub/k8s/

        echo "Executing remote deployment..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST << EOF
          set -e
          
          # 1. Installazione K3s (se non presente)
          if ! command -v k3s &> /dev/null; then
              echo "Installing K3s..."
              curl -sfL https://get.k3s.io | sh -
              sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          fi
          
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # 2. Spegnere Docker Compose vecchio (se attivo)
          if [ -f /home/$USER/hackhub/docker-compose.yml ]; then
             echo "Stopping old Docker Compose stack..."
             # Ignora errori se docker-compose non c'è o container già spenti
             docker-compose -f /home/$USER/hackhub/docker-compose.yml down || true
          fi

          # 3. Creazione Secrets in Kubernetes (Sostituiscono il file .env)
          # Cancelliamo i vecchi secret per ricrearli aggiornati
          sudo k3s kubectl delete secret postgres-secret backend-secrets --ignore-not-found

          # Secret DB
          sudo k3s kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD_PROD }}'

          # Secret Variabili Backend (JWT, ecc)
          # Nota: Qui creiamo un secret apposta per le env vars java
          sudo k3s kubectl create secret generic backend-secrets \
            --from-literal=HACKHUB_APP_JWTSECRETBASE64='${{ secrets.JWT_SECRET }}'

          # 4. Patch Immagini nei deployment YAML
          # K3s deve usare l'immagine giusta da GHCR
          # Usiamo 'sed' per sostituire i nomi delle immagini nei file yaml sulla EC2
          
          FULL_IMAGE_BACK="ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-backend:latest"
          FULL_IMAGE_FRONT="ghcr.io/${{ steps.owner.outputs.lc }}/hackhub-frontend:latest"
          
          # Sostituisce 'image: hackhub-backend:latest' con l'URL completo di GHCR
          sed -i "s|image: hackhub-backend:latest|image: \$FULL_IMAGE_BACK|g" /home/$USER/hackhub/k8s/backend/backend-deployment.yaml
          sed -i "s|image: hackhub-frontend:latest|image: \$FULL_IMAGE_FRONT|g" /home/$USER/hackhub/k8s/frontend/frontend-deployment.yaml

          # 5. Apply su Kubernetes
          echo "Applying Kubernetes Manifests..."
          sudo k3s kubectl apply -R -f /home/$USER/hackhub/k8s/
          
          # Force restart per scaricare la nuova immagine (se le tag sono 'latest')
          sudo k3s kubectl rollout restart deployment hackhub-backend
          sudo k3s kubectl rollout restart deployment hackhub-frontend

          echo "Deployment successful! 🚀"
        EOF