apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackhub-backend
  template:
    metadata:
      labels:
        app: hackhub-backend
    spec:
      containers:
      - name: hackhub-backend
        image: hackhub-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # Legge il JWT Secret da Kubernetes (creato dalla CI)
        - name: HACKHUB_APP_JWTSECRETBASE64
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: HACKHUB_APP_JWTSECRETBASE64
        
        # Connessione DB
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/hackhub_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "admin"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD