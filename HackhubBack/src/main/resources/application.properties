spring.application.name=HackhubBack

## Configurazione PostgreSQL
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://localhost:5432/hackhub_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# JWT key: preferiamo usare una chiave base64 via env var JWT_SECRET_BASE64
# La chiave NON deve essere committata qui.
hackhub.app.jwtSecret=
hackhub.app.jwtSecretBase64=
hackhub.app.jwtExpirationMs=3600000

# Per vedere le query SQL nella console (utile per debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Log
logging.level.com.hackhub=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.hackhub.hackhubback.security=DEBUG