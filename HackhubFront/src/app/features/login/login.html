<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h3>Login</h3>
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" [(ngModel)]="credentials.username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" [(ngModel)]="credentials.password" required>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <button type="submit" class="btn btn-success w-100">Accedi</button>
      </form>
    </div>
  </div>
</div>
